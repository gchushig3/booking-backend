name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/booking_ci
      JWT_SECRET: ci-only-secret-for-tests-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, validate fresh migrations and run backend tests
        run: npm run migration:smoke
